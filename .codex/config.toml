[tui]
# Start the prompt composer with Vim keybindings enabled.
vim_mode_default = true
screen_reader_detection_done = true

[projects."/Users/irinalapteva/maptv/setup"]
trust_level = "trusted"

# Keep Ctrl+J as an alternative when the terminal cannot distinguish Shift+Enter.
[tui.keymap.editor]
insert_newline = ["shift-enter", "ctrl-j"]

[tui.model_availability_nux]
"gpt-6.1-sol" = 2
